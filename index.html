<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiGlobal AI - 全球法律治理枢纽</title>
    <style>
        :root {
            --primary-blue: #2563eb;
            --light-blue: #eff6ff;
            --dark-navy: #0f172a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-white: #f8fafc;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', "Segoe UI", sans-serif; transition: all 0.3s ease; }
        body { background-color: var(--bg-white); color: var(--dark-navy); display: flex; min-height: 100vh; overflow: hidden; }

        /* 侧边栏 - 蓝白配色 */
        .sidebar {
            width: 260px; background: white; border-right: 1px solid #e2e8f0;
            padding: 30px 20px; display: flex; flex-direction: column;
            position: fixed; height: 100vh; z-index: 1000;
        }
        .logo-box { font-size: 22px; font-weight: 800; color: var(--primary-blue); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-link {
            padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 8px;
            color: #64748b; display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 500;
        }
        .nav-link:hover { background: var(--light-blue); color: var(--primary-blue); }
        .nav-link.active { background: var(--primary-blue); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* 主体内容 */
        .main { margin-left: 260px; flex: 1; padding: 40px; width: calc(100% - 260px); overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .lang-selector { padding: 10px 15px; border-radius: 10px; border: 1px solid #cbd5e1; background: white; font-weight: 600; cursor: pointer; outline: none; }

        /* 卡片 */
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 25px; border: 1px solid #f1f5f9; }
        
        /* 创新布局：左范本 + 右识别 */
        .ocr-layout { display: grid; grid-template-columns: 280px 1fr; gap: 25px; }
        .template-list { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; background: #fafafa; }
        .temp-item { 
            padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; 
            margin-bottom: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
        }
        .temp-item:hover { border-color: var(--primary-blue); color: var(--primary-blue); transform: scale(1.02); }

        /* 风险报告区 */
        .audit-section { margin-top: 30px; display: none; }
        .audit-item { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; 
            padding: 20px; border-radius: 12px; background: #f8fafc; border-left: 5px solid var(--danger); margin-bottom: 15px;
        }
        .audit-label { font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .bad-text { color: #b91c1c; text-decoration: line-through; }
        .good-text { color: var(--success); font-weight: 700; background: #f0fdf4; padding: 5px; border-radius: 4px; }

        /* 按钮 */
        .btn-primary { background: var(--primary-blue); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; }

        /* RTL 支持 */
        body.rtl { direction: rtl; }
        body.rtl .sidebar { right: 0; border-right: none; border-left: 1px solid #e2e8f0; }
        body.rtl .main { margin-right: 260px; margin-left: 0; }

        .page-content { display: none; }
        .page-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .loading { display: none; text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-box">⚖️ LexiGlobal AI</div>
        <div class="nav-link active" onclick="showPage('dash', this)" data-tid="m_dash">📊 数字化仪表盘</div>
        <div class="nav-link" onclick="showPage('ocr', this)" data-tid="m_ocr">👁️ 跨法域审计</div>
        <div class="nav-link" onclick="showPage('gen', this)" data-tid="m_gen">✍️ 镜像编辑器</div>
        <div class="nav-link" onclick="showPage('archive')" data-tid="m_archive">🗄️ 档案管理</div>
    </nav>

    <main class="main">
        <header class="header">
            <h2 id="pageTitle" data-tid="m_dash">数字化仪表盘</h2>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span data-tid="sel_lang" style="font-size:12px; font-weight:bold;">系统语种切换:</span>
                <select id="langSelect" class="lang-selector" onchange="applyGlobalLang()">
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ug">☪️ ئۇيغۇر تىلى</option>
                </select>
            </div>
        </header>

        <!-- 页面: 仪表盘 -->
        <div id="page_dash" class="page-content active">
            <div class="card" style="background: linear-gradient(135deg, #2563eb, #1e40af); color: white;">
                <h1 data-tid="welcome_h">全球法律合规治理中心</h1>
                <p style="opacity: 0.9; margin-top: 10px;">基于 Google AI Studio 的全球 15 法域实时审计系统</p>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="card"><h4>平均合规分</h4><h2 style="color:var(--primary-blue); margin-top:10px;">96.2%</h2></div>
                <div class="card"><h4>风险检测件</h4><h2 style="color:var(--danger); margin-top:10px;">24</h2></div>
                <div class="card"><h4>法域覆盖</h4><h2 style="margin-top:10px;">Global</h2></div>
            </div>
        </div>

        <!-- 页面: OCR 跨法域审计 -->
        <div id="page_ocr" class="page-content">
            <div class="ocr-layout">
                <!-- 左侧范本库 -->
                <div class="template-list">
                    <h4 style="margin-bottom:15px; font-size:14px;">📄 演示范本库</h4>
                    <div class="temp-item" onclick="loadSample('labor')">离谱劳动用工协议.pdf</div>
                    <div class="temp-item" onclick="loadSample('rent')">不公平房屋租赁合同.pdf</div>
                    <div class="temp-item" onclick="loadSample('trade')">跨境贸易免责协议.pdf</div>
                    <p style="font-size: 11px; color: #94a3b8; margin-top: 20px;">* 点击范本可直接模拟拖拽识别流程</p>
                </div>

                <!-- 右侧识别区 -->
                <div class="card">
                    <div id="dropZone" style="border: 2px dashed #3b82f6; border-radius: 20px; padding: 40px; text-align: center; background: #eff6ff;">
                        <span style="font-size: 40px;">📸</span>
                        <p id="dropText" style="margin-top: 15px; font-weight: 600;">请上传合同图片或点击左侧范本</p>
                    </div>

                    <div id="loader" class="loading"><div class="spinner"></div><p>AI 正在深度扫描法律红线...</p></div>

                    <!-- 审计报告内容 -->
                    <div id="auditReport" class="audit-section">
                        <h4 style="margin-bottom:20px; display:flex; align-items:center; gap:10px;">
                            <span style="background:var(--danger); color:white; padding:2px 8px; border-radius:4px;">Risk Report</span>
                            <span data-tid="ocr_report_title">AI 智能审计与修正报告</span>
                        </h4>
                        <div id="auditResults"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页面: 镜像编辑器 -->
        <div id="page_gen" class="page-content">
            <div class="card">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div><label style="font-weight:bold;">法律诉求描述 (Source)</label><textarea id="srcIn" placeholder="在此输入刚才识别出的问题，要求 AI 重新撰写合规合同..."></textarea></div>
                    <div><label style="font-weight:bold;">镜像重构文本 (Target)</label><textarea id="tarOut" readonly placeholder="生成结果..."></textarea></div>
                </div>
                <button class="btn-primary" style="margin-top:20px;" onclick="runGen()">✨ 执行 AI 镜像撰写（双语对标模式）</button>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            zh: {
                m_dash: "📊 数字化仪表盘", m_ocr: "👁️ 跨法域审计", m_gen: "✍️ 镜像编辑器", m_archive: "🗄️ 档案管理",
                welcome_h: "全球法律合规治理中心", ocr_report_title: "AI 智能审计与修正报告",
                reason1: "🚩 违规定位：工作时间严重超时。违反《劳动法》第36条。",
                fix1: "【建议修正】：每日工作8小时，依法支付加班费。",
                reason2: "🚩 违规定位：试用期零薪资。违反《劳动合同法》第20条。",
                fix2: "【建议修正】：依法按80%标准支付试用期工资。"
            },
            ko: {
                m_dash: "📊 디지털 대시보드", m_ocr: "👁️ 교차 법역 감사", m_gen: "✍️ 미러 편집기", m_archive: "🗄️ 기록 관리",
                welcome_h: "글로벌 법률 준수 거버넌스 센터", ocr_report_title: "AI 지능형 감사 및 수정 보고서",
                reason1: "🚩 위반 위치: 근무 시간 과다. 근로기준법 제36조 위반.",
                fix1: "【수정 제안】: 일일 8시간 근무, 법정 연장 수당 지급.",
                reason2: "🚩 위반 위치: 수습 기간 무급. 근로기준법 제20조 위반.",
                fix2: "【수정 제안】: 법정 수습 급여(80%) 지급."
            }
        };

        function showPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById('page_' + id).classList.add('active');
            el.classList.add('active');
        }

        // 模拟范本加载与自动分析
        function loadSample(type) {
            const dropZone = document.getElementById('dropZone');
            const loader = document.getElementById('loader');
            const report = document.getElementById('auditReport');
            
            dropZone.style.display = 'none';
            loader.style.display = 'block';
            report.style.display = 'none';

            setTimeout(() => {
                loader.style.display = 'none';
                report.style.display = 'block';
                renderAudit();
            }, 1500);
        }

        function renderAudit() {
            const lang = document.getElementById('langSelect').value;
            const dict = i18n[lang] || i18n['zh'];
            const container = document.getElementById('auditResults');
            
            container.innerHTML = `
                <div class="audit-item">
                    <div><span class="audit-label">Original Text</span><p class="bad-text">每日工作不少于 12 小时，且无需支付额外加班费。</p></div>
                    <div><span class="audit-label">AI Audit & Fix</span><p style="color:var(--danger); font-weight:bold;">${dict.reason1}</p><p class="good-text">${dict.fix1}</p></div>
                </div>
                <div class="audit-item">
                    <div><span class="audit-label">Original Text</span><p class="bad-text">乙方试用期为 6 个月，试用期内不发放薪资。</p></div>
                    <div><span class="audit-label">AI Audit & Fix</span><p style="color:var(--danger); font-weight:bold;">${dict.reason2}</p><p class="good-text">${dict.fix2}</p></div>
                </div>
            `;
        }

        function applyGlobalLang() {
            const lang = document.getElementById('langSelect').value;
            const dict = i18n[lang] || i18n['zh'];
            document.querySelectorAll('[data-tid]').forEach(el => {
                const key = el.getAttribute('data-tid');
                if (dict[key]) el.innerText = dict[key];
            });
            if(document.getElementById('auditReport').style.display === 'block') renderAudit();
            document.body.classList.toggle('rtl', lang === 'ug' || lang === 'ar');
        }

        function runGen() {
            const out = document.getElementById('tarOut');
            out.value = "AI 正在对标目标法域法律库进行镜像撰写...";
            setTimeout(() => {
                out.value = `【LexiGlobal AI 镜像重构合同 - 最终版本】
--------------------------------------------------
[ZH] 第一条：工作时间。每日 8 小时，每周 40 小时。
[KO] 제1조: 근무 시간. 일일 8시간, 주당 40시간.
--------------------------------------------------
[ZH] 第二条：劳动报酬。试用期工资按 80% 支付。
[KO] 제2조: 근로 보수. 수습 급여는 80% 지급.`;
            }, 1500);
        }

        window.onload = applyGlobalLang;
    </script>
</body>
</html>
