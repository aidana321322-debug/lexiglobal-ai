<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiGlobal AI - 全球全栈法律枢纽</title>
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
            --bg: #f8fafc; --sidebar-w: 260px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; transition: all 0.3s ease; }
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; overflow: hidden; }
        
        /* 侧边栏 */
        .sidebar { width: var(--sidebar-w); background: var(--primary); color: white; padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 1000; }
        .logo-box { font-size: 24px; font-weight: 800; margin-bottom: 40px; color: #3b82f6; letter-spacing: -1px; }
        .nav-link { padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 8px; color: #94a3b8; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: var(--accent); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        .main { margin-left: var(--sidebar-w); flex: 1; padding: 40px; width: calc(100% - var(--sidebar-w)); overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
        .lang-selector { padding: 10px 15px; border-radius: 10px; border: 1px solid #cbd5e1; background: white; font-weight: 600; cursor: pointer; }

        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #f1f5f9; }
        
        /* 风险温度计创新 */
        .meter-box { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
        .meter { flex: 1; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; position: relative; }
        .meter-fill { width: 0%; height: 100%; background: var(--danger); transition: width 2s ease; }

        /* 输入切换 */
        .input-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 8px 15px; background: #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .tab.active { background: var(--accent); color: white; }

        /* 法律审计表 */
        .audit-table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        .audit-table th { background: #f8fafc; padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0; font-size: 13px; }
        .audit-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; vertical-align: top; font-size: 13px; line-height: 1.6; }

        .loading { display: none; text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* RTL */
        body.rtl { direction: rtl; }
        body.rtl .sidebar { right: 0; }
        body.rtl .main { margin-right: var(--sidebar-w); margin-left: 0; }
        body.rtl .audit-table th { text-align: right; }

        .page-content { display: none; }
        .page-content.active { display: block; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">LEXIGLOBAL AI</div>
        <div class="nav-link active" onclick="showPage('dash', this)" data-tid="m_dash">📊 全球仪表盘</div>
        <div class="nav-link" onclick="showPage('ocr', this)" data-tid="m_ocr">👁️ 跨法域审计</div>
        <div class="nav-link" onclick="showPage('gen', this)" data-tid="m_gen">✍️ 镜像编辑器</div>
        <div class="nav-link" onclick="showPage('archive')" data-tid="m_archive">🗄️ 智能归档</div>
    </aside>

    <main class="main">
        <header class="header">
            <h2 id="pageTitle" data-tid="m_dash">全球仪表盘</h2>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span data-tid="sel_lang" style="font-size:12px; color:#64748b;">系统语言:</span>
                <select id="langSelect" class="lang-selector" onchange="applyGlobalLang()">
                    <option value="zh">🇨🇳 中文</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ko">🇰🇷 한국어</option>
                    <option value="ug">☪️ ئۇيغۇر تىلى</option>
                </select>
            </div>
        </header>

        <!-- 页面: 仪表盘 -->
        <div id="page_dash" class="page-content active">
            <div class="card" style="background: var(--primary); color: white;">
                <h1 data-tid="welcome_h">全球法律治理 AI 枢纽</h1>
                <p style="opacity: 0.8; margin-top: 10px;" data-tid="welcome_p">系统已实时对接全球法典库。正在监控跨国商务安全。</p>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="card"><h4 data-tid="stat_1">平均合规率</h4><h2 style="color:var(--success); margin-top:10px;">94.2%</h2></div>
                <div class="card"><h4 data-tid="stat_2">检测漏洞</h4><h2 style="color:var(--danger); margin-top:10px;">2</h2></div>
                <div class="card"><h4>支持语言</h4><h2 style="margin-top:10px;">100+</h2></div>
            </div>
        </div>

        <!-- 页面: OCR 审计 -->
        <div id="page_ocr" class="page-content">
            <div class="card">
                <h3 data-tid="ocr_h">多模态智能合规审计</h3>
                <div class="input-tabs" style="margin-top:20px;">
                    <div class="tab active" onclick="setInputMode('file')" data-tid="t1">文件/图片</div>
                    <div class="tab" onclick="setInputMode('camera')" data-tid="t2">拍照</div>
                    <div class="tab" onclick="setInputMode('paste')" data-tid="t3">粘贴文本</div>
                </div>

                <div id="inputBox">
                    <div id="dropZone" onclick="triggerFile()" style="border: 2px dashed #3b82f6; border-radius: 20px; padding: 50px; text-align: center; background: #eff6ff; cursor: pointer;">
                        <span style="font-size: 50px;">📸</span>
                        <p id="label_p" style="margin-top: 15px; font-weight: 600;" data-tid="ocr_p">上传 PDF、合同照片或扫描件</p>
                    </div>
                    <textarea id="pasteIn" style="display:none; height: 150px; margin-top:10px;" placeholder="在此粘贴合同条文..."></textarea>
                    <input type="file" id="realFile" style="display:none" onchange="startAnalyze()">
                </div>

                <div id="loader" class="loading"><div class="spinner"></div><p data-tid="loading_t">AI 正在深度检索全球监管库...</p></div>

                <div id="resultBox" style="display:none; margin-top:30px;">
                    <h4 data-tid="risk_title">可视化风险评估 (Risk Heatmap)</h4>
                    <div class="meter-box">
                        <span style="color:var(--danger); font-weight:bold;">High Risk</span>
                        <div class="meter"><div id="mFill" class="meter-fill"></div></div>
                        <span id="riskScore">85%</span>
                    </div>

                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th data-tid="th_1">原始条款</th>
                                <th data-tid="th_2">AI 风险审计 (多语种同步)</th>
                                <th data-tid="th_3">AI 修改建议</th>
                            </tr>
                        </thead>
                        <tbody id="auditBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 页面: 编辑器 -->
        <div id="page_gen" class="page-content">
            <div class="card">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <textarea id="srcIn" placeholder="输入需求..."></textarea>
                    <textarea id="tarOut" readonly placeholder="镜像生成结果..."></textarea>
                </div>
                <button class="btn" style="background:var(--primary); color:white; width:100%; margin-top:15px;" onclick="runGen()">✨ 执行 AI 镜像撰写</button>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            zh: {
                m_dash: "📊 全球仪表盘", m_ocr: "👁️ 跨法域审计", m_gen: "✍️ 镜像编辑器", m_archive: "🗄️ 合规归档",
                welcome_h: "全球法律治理 AI 枢纽", stat_1: "平均合规率", stat_2: "检测漏洞",
                ocr_h: "多模态智能合规审计", ocr_p: "上传 PDF、合同照片或扫描件", t1: "文件/图片", t2: "拍照", t3: "粘贴文本",
                loading_t: "AI 正在深度检索全球监管库...", risk_title: "可视化风险评估 (Risk Heatmap)",
                th_1: "原始条款", th_2: "AI 风险审计 (多语种同步)", th_3: "AI 修改建议", sel_lang: "系统语言:",
                r_bad: "“甲方可随时单方面解除合同并不退费。”",
                r_why: "🚩 高风险：违反《民法典》公平原则。剥夺了乙方的合法抗辩权，此类条款在法院通常被裁定无效。",
                r_fix: "“建议修改为：经双方协商一致或在法律规定情形下可解除。甲方应按实际履约进度据实退费。”"
            },
            en: {
                m_dash: "📊 Dashboard", m_ocr: "👁️ Compliance Audit", m_gen: "✍️ Mirror Editor", m_archive: "🗄️ Archive",
                welcome_h: "Global Legal Governance AI Hub", stat_1: "Compliance", stat_2: "Risks",
                ocr_h: "Multi-modal Compliance Audit", ocr_p: "Upload PDF, Photo or Scans", t1: "File/Image", t2: "Camera", t3: "Paste",
                loading_t: "AI is retrieving global regulatory databases...", risk_title: "Risk Heatmap Analysis",
                th_1: "Original Clause", th_2: "AI Risk Audit (Synced)", th_3: "AI Advice", sel_lang: "Language:",
                r_bad: "“Party A may terminate unilaterally without any refund.”",
                r_why: "🚩 High Risk: Violates the 'Principle of Fairness'. This clause is unconscionable and likely unenforceable.",
                r_fix: "“Suggested: Termination by mutual consent or legal cause, with pro-rata refund for unperformed services.”"
            },
            ko: {
                m_dash: "📊 대시보드", m_ocr: "👁️ 준법 감사", m_gen: "✍️ 편집기", m_archive: "🗄️ 아카이브",
                welcome_h: "글로벌 법률 거버넌스 AI 허브", stat_1: "준수율", stat_2: "리스크",
                ocr_h: "멀티모달 지능형 준법 감사", ocr_p: "PDF, 사진 또는 스캔 업로드", t1: "파일/이미지", t2: "사진 촬영", t3: "붙여넣기",
                loading_t: "AI가 글로벌 규제 DB를 심층 검색 중...", risk_title: "시각화된 리스크 분석",
                th_1: "원본 조항", th_2: "AI 리스크 감사 (동기화)", th_3: "AI 수정 제안", sel_lang: "언어:",
                r_bad: "“갑은 언제든지 일방적으로 해지할 수 있으며 환불은 불가하다.”",
                r_why: "🚩 심각한 리스크: 민법상 형평성 원칙 위반. 상대방의 항변권을 박탈하므로 법원에서 무효로 간주될 수 있음.",
                r_fix: "“제안: 합의 또는 법적 사유 시 해지하며, 잔여 비용은 실비 정산하여 환불함.”"
            }
        };

        function setInputMode(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const zone = document.getElementById('dropZone');
            const paste = document.getElementById('pasteIn');
            if(mode === 'paste') { zone.style.display='none'; paste.style.display='block'; }
            else { zone.style.display='block'; paste.style.display='none'; }
        }

        function triggerFile() { document.getElementById('realFile').click(); }

        function startAnalyze() {
            document.getElementById('inputBox').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('resultBox').style.display = 'block';
                setTimeout(() => { document.getElementById('mFill').style.width = '85%'; }, 100);
                renderTable();
            }, 2000);
        }

        function renderTable() {
            const l = document.getElementById('langSelect').value;
            const d = i18n[l] || i18n['zh'];
            document.getElementById('auditBody').innerHTML = `
                <tr>
                    <td style="color:#64748b">${d.r_bad}</td>
                    <td style="color:var(--danger)">${d.r_why}</td>
                    <td style="color:var(--success); font-weight:bold;">${d.r_fix}</td>
                </tr>
            `;
        }

        function applyGlobalLang() {
            const l = document.getElementById('langSelect').value;
            const d = i18n[l] || i18n['zh'];
            document.querySelectorAll('[data-tid]').forEach(el => {
                const k = el.getAttribute('data-tid');
                if (d[k]) el.innerText = d[k];
            });
            if(document.getElementById('resultBox').style.display === 'block') renderTable();
            document.body.classList.toggle('rtl', l === 'ug' || l === 'ar');
        }

        function showPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById('page_' + id).style.display = 'block';
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = el.innerText;
        }

        function runGen() {
            const tar = document.getElementById('tarOut');
            tar.value = "AI 正在执行全球对标镜像撰写...";
            setTimeout(() => { tar.value = "【LexiGlobal AI 镜像文本】\n1. 签署目的 (Object)\n2. 违约责任：已根据最新合规要求修正风险点...\n3. 争议解决：建议提交当地仲裁机构..."; }, 1500);
        }

        window.onload = applyGlobalLang;
    </script>
</body>
</html>
